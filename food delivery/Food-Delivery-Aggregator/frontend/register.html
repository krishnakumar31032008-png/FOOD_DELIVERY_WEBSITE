<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Foodie Express</title>
    <!-- External stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. NAVIGATION BAR -->
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">🍕 Foodie Express</a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="restaurants.html">Restaurants</a></li>
            <li><a href="login.html">Login</a></li>
            <li>
                <a href="cart.html">
                    Cart <span class="cart-badge">0</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- 2. REGISTRATION FORM CONTAINER -->
    <main class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Create an Account</h2>
            <p class="auth-subtitle">Join Foodie Express and start ordering food now</p>

            <!-- Registration Form -->
            <form id="registerForm">
                
                <!-- Full Name Input -->
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input 
                        type="text" 
                        id="regName" 
                        class="form-control" 
                        placeholder="Enter your full name" 
                        required
                    >
                </div>

                <!-- Email Input -->
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="regEmail" 
                        class="form-control" 
                        placeholder="Enter your email" 
                        required
                    >
                </div>

                <!-- Phone Number Input -->
                <div class="form-group">
                    <label for="regPhone">Phone Number</label>
                    <input 
                        type="tel" 
                        id="regPhone" 
                        class="form-control" 
                        placeholder="Enter your 10-digit mobile number" 
                        required
                    >
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input 
                        type="password" 
                        id="regPassword" 
                        class="form-control" 
                        placeholder="Create a password" 
                        required
                    >
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn">Register</button>

            </form>

            <!-- Link to Login Page -->
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </main>

    <!-- 3. FOOTER -->
    <footer class="footer">
        <p>&copy; 2026 <strong>Foodie Express</strong>. All rights reserved.</p>
        <p>Simple & Friendly Food Delivery Aggregator</p>
    </footer>

    <!-- External JavaScript -->
    <script src="js/script.js"></script>
</body>
</html>
